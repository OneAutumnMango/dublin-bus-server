name: Release

on:
  push:
    tags:
      # Plain numeric versions such as 1.2.3 or 1.11.2 (no "v" prefix).
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --console=plain test distZip distTar
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # --generate-notes lists the commits and PRs since the previous release tag.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/distributions/*.zip build/distributions/*.tar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
