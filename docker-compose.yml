services:
  dublin-bus-server:
    build: .
    image: dublin-bus-server:latest
    container_name: dublin-bus-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    env_file:
      - server.env
    environment:
      # Feeds to poll, and how hard to poll them. See README for the safe-rate rules.
      FEEDS: "${FEEDS:-TRIP_UPDATES,VEHICLES}"
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-}"
      HISTORY_DEPTH: "${HISTORY_DEPTH:-30}"
      GTFS_STATIC_PATH: /data/gtfs_static.json
    volumes:
      - gtfs-data:/data

  dublin-bus-analytics:
    profiles: ["analytics"]  # opt in: needs the sibling ../dublin-bus-analytics checkout
    build: ../dublin-bus-analytics
    container_name: dublin-bus-analytics
    restart: unless-stopped
    depends_on: [dublin-bus-server]
    ports: ["127.0.0.1:${ANALYTICS_PORT:-8081}:8081"]
    environment:
      SERVER_URL: http://dublin-bus-server:8080
      POLL_SECONDS: "${ANALYTICS_POLL_SECONDS:-30}"
      BACKUP_ENABLED: "${ANALYTICS_BACKUP_ENABLED:-true}"
      BACKUP_TIME: "${ANALYTICS_BACKUP_TIME:-03:00}"
      BACKUP_KEEP: "${ANALYTICS_BACKUP_KEEP:-7}"
      BACKUP_DIR: "${ANALYTICS_BACKUP_DIR:-/data/backups}"
    volumes: [analytics-data:/data]

volumes:
  gtfs-data:
  analytics-data:
